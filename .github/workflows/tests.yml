name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        # Se usa npm install y no npm ci a proposito: el arbol de dependencias
        # incluye bindings opcionales especificos de plataforma (los nativos de
        # sqlite3 y el binding WASM que arrastra jest-resolve). El lockfile se
        # genera en Windows y no puede representar el subarbol que Linux
        # necesita, por lo que npm ci falla al validar. npm install resuelve la
        # diferencia en cada runner.
        run: npm install

      - name: Correr las pruebas
        run: npm test
