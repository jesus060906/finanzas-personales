name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 18 quedo fuera porque sqlite3 6.x exige >= 20.17.0
        node: ['20', '22']

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        # Se usa npm install y no npm ci a proposito: el arbol de dependencias
        # incluye bindings opcionales especificos de plataforma (los nativos de
        # sqlite3 y el binding WASM que arrastra jest-resolve). El lockfile se
        # genera en Windows y no puede representar el subarbol que Linux
        # necesita, por lo que npm ci falla al validar. npm install resuelve la
        # diferencia en cada runner.
        run: npm install

      - name: Correr las pruebas
        run: npm test

      # El reporte se genera en una sola version de Node para no triplicar el
      # tiempo de la matriz. Se publica como artifact para poder descargarlo
      # desde la pestana Actions sin depender de ningun servicio externo.
      - name: Reporte de cobertura
        if: matrix.node == '22'
        run: npm run test:coverage

      - name: Publicar el reporte HTML
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/lcov-report
          retention-days: 30
