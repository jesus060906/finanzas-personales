<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanzas Personales · Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
</head>
<body class="login-page">
  <button class="tema-toggle tema-toggle-float" data-tema-toggle type="button" aria-label="Cambiar tema"></button>
  <div class="login-backdrop"></div>
  <main class="login-card">
    <div class="login-brand">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <circle cx="12" cy="12" r="2.6"></circle>
          <path d="M6 12h.01M18 12h.01"></path>
        </svg>
      </div>
      <h1>Finanzas <span>Personales</span></h1>
      <p>Gestión multiusuario de ingresos, egresos y cortes mensuales.</p>
    </div>

    <form id="login-form" class="login-form" autocomplete="off">
      <div class="field">
        <label for="cedula">Cédula o RNC</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
            <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path>
          </svg>
          <input id="cedula" name="cedula" type="text" autocomplete="off" placeholder="000-0000000-0" required />
        </div>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="4" y="10" width="16" height="11" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          </svg>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="••••••••" required />
        </div>
      </div>
      <p id="login-error" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="btn-login">
        <span>Entrar al sistema</span>
      </button>
    </form>

    <p class="login-hint">Demo — <span class="cred">Admin: <code>000-0000000-0</code> / <code>admin123</code></span> · <span class="cred">Juan Pérez: <code>001-1234567-3</code> / <code>usuario123</code></span> · <span class="cred">Carlos Rivera: <code>402-1234567-8</code> / <code>usuario123</code></span> · <span class="cred">Comercial Norte: <code>130-12345-4</code> / <code>empresa123</code></span></p>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
